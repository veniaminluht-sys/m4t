.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:var(--s4) 0 2px;padding-top:var(--s3);border-top:var(--bw) solid var(--edge)}

/* ---------- weather ---------- */
.ftab{width:100%;border-collapse:collapse}

.ftab td{padding:10px 8px;border-bottom:var(--bw) solid var(--line);vertical-align:top}
.ftab td.v{font:600 15px var(--font-mono);white-space:nowrap}
.ftab td.n{display:flex;align-items:flex-start;gap:8px}
.ftab td.n .ic{color:var(--ink-muted);margin-top:1px}

@media (max-width:620px){.ftab thead{display:none}.ftab tr{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:var(--bw) solid var(--line)}.ftab td{border:0;padding:2px 0}.ftab td.v{text-align:right}.ftab td.s,.ftab td.p{grid-column:1/-1}}

/* ---------- flight (op mode) ---------- */
.op{display:grid;gap:var(--s3);grid-template-columns:repeat(2,minmax(0,1fr));max-width:1180px;margin:0 auto;padding:var(--s3)}
.op .cell{background:var(--surface);border:var(--bw) solid var(--edge);padding:var(--s3);min-height:104px;display:flex;flex-direction:column;gap:4px;text-align:left;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}

.op .cell .big{font:700 24px/1.05 var(--font-display);letter-spacing:.02em}
.op .timer{grid-column:1/-1;align-items:center;text-align:center;padding:var(--s5) var(--s3);background:var(--screen);color:var(--screen-ink)}

.tval{font:700 clamp(72px,22vw,190px)/.9 var(--font-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(46,230,255,.3)}
.tsub{font:500 14px var(--font-mono);color:var(--screen-muted)}.tsub b{color:var(--screen-ink)}
.op .timer.w .tval{color:var(--warn)}.op .timer.x .tval{color:var(--stop)}
.op .run{grid-column:1/-1;min-height:var(--t-run);font-size:18px}
.op .sos{grid-column:1/-1;min-height:var(--t-sos);background:var(--stop);color:var(--on-stop);border:0;font:700 22px var(--font-display);letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:var(--shadow-stop);
  clip-path:polygon(var(--cut-lg) 0,100% 0,100% calc(100% - var(--cut-lg)),calc(100% - var(--cut-lg)) 100%,0 100%,0 var(--cut-lg))}
@media (min-width:960px){.op{grid-template-columns:repeat(4,minmax(0,1fr));padding:var(--s5) var(--s6);gap:var(--s4)}.op .timer{grid-column:1/3;grid-row:1/3}.op .run{grid-column:1/3;grid-row:3}.op .marks{grid-column:3/5;grid-row:1/3}.op .sos{grid-column:3/5;grid-row:3}.op .tval{font-size:clamp(72px,9vw,150px)}}

/* ---------- sheets, toast, alarm ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{width:100%;max-width:680px;max-height:90vh;overflow:auto;background:var(--surface);border-top:var(--bw) solid var(--edge);padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));animation:rise .22s cubic-bezier(.2,.8,.2,1)}

.sheet h2{margin:2px 0 8px;font:700 26px/1.05 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.acts{display:grid;gap:var(--s2);margin-top:var(--s4)}

.steps{list-style:none;margin:var(--s3) 0 0;padding:0}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:12px 0;border-top:var(--bw) solid var(--line)}
.steps li>b{font:700 28px/1 var(--font-display);color:var(--ink-muted)}
.steps li strong{display:block;font:600 10.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.steps li span{font-size:17px;font-weight:600}
.note{font:400 12px/1.5 var(--font-mono);color:var(--ink-muted);border:1px dashed var(--edge);padding:8px 10px;margin-top:var(--s3)}
.toast{position:fixed;left:50%;top:calc(var(--hd) + env(safe-area-inset-top) + 12px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;font:600 13px var(--font-sans);max-width:92vw;animation:rise .2s}
.alarm{position:fixed;inset:0;z-index:70;background:var(--stop);color:var(--on-stop);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}

@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translate(var(--tx,0),14px);opacity:0}}
.toast{--tx:-50%}

/* ---------- conduit ---------- */
.cond{position:fixed;inset:0;z-index:40;pointer-events:none}
.cond path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--l) var(--l);animation:cd .65s cubic-bezier(.4,0,.2,1) both,cf 1.5s linear both}

@keyframes cd{from{stroke-dashoffset:var(--l)}to{stroke-dashoffset:0}}@keyframes cf{0%,55%{opacity:1}100%{opacity:0}}

/* ---------- palette ---------- */
.pal-veil{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:flex;justify-content:center;align-items:flex-start;padding:10vh 12px 12px}
.pal{width:min(640px,100%);background:var(--surface);border:var(--bw) solid var(--edge);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.pal .in{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:var(--bw) solid var(--edge)}
.pal .in .ic{color:var(--accent)}
.pal input{flex:1;background:transparent;border:0;padding:16px 0;font:500 17px var(--font-mono);color:var(--ink);outline:none}
.pal ul{list-style:none;margin:0;padding:6px 0;max-height:56vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}

.pal li[aria-selected="true"]{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
.pal li[aria-selected="true"] .ic{color:var(--accent)}
.pal .ph{font:600 10px var(--font-mono);letter-spacing:.12em;color:var(--ink-muted);padding:10px 16px 4px;text-transform:uppercase;cursor:default}
.pal .ft{display:flex;gap:16px;padding:8px 16px;border-top:var(--bw) solid var(--edge);font:400 11px var(--font-mono);color:var(--ink-muted)}

/* ---------- quiz ---------- */
.q .opts{display:grid;gap:6px;margin-top:var(--s2)}
.q .opts button{min-height:var(--t-min);text-align:left;padding:10px 12px;background:var(--bg);border:var(--bw) solid var(--edge)}
.q .opts button.right{border-color:var(--ok);color:var(--ok)}.q .opts button.wrong{border-color:var(--stop);color:var(--stop-ink)}
.prog{height:6px;background:var(--bg);border:1px solid var(--edge);margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}
.empty{display:grid;justify-items:center;gap:10px;text-align:center;padding:var(--s6) var(--s4);color:var(--ink-muted)}
.empty .ic{color:var(--ink-faint)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@supports (-webkit-touch-callout:none){@media (display-mode:standalone) and (max-width:959px){.nav{padding-bottom:max(env(safe-area-inset-bottom),18px)}.shell{grid-template-rows:calc(var(--hd) + env(safe-area-inset-top)) minmax(0,1fr) calc(var(--nav) + max(env(safe-area-inset-bottom),18px))}}}

/* --- v7: kaart, märked, päevik, fotod, juhend, print --- */
.loc[data-go]{cursor:pointer}
.zwrap{margin-top:var(--s3);border:1px solid #2c4568;background:rgba(0,0,0,.18)}
.zmap{width:100%;aspect-ratio:1;display:block}
.zmap .r{fill:none;stroke:#2c4568}.zmap .ax{stroke:#2c4568;stroke-dasharray:2 3}
.zmap .fr{fill:rgba(46,230,255,.12);stroke:var(--screen-accent);stroke-width:1.5;stroke-dasharray:4 3}
.zmap text{font:600 9px var(--font-mono);fill:var(--screen-muted)}
.zmap .zl{font:700 8.5px var(--font-mono);fill:var(--screen-ink);paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:2.5px}

.op .marks{grid-column:1/-1}

.mlist{display:grid;gap:2px;font:400 12px var(--font-mono);color:var(--ink-muted)}

.stats>div{border:var(--bw) solid var(--edge);padding:10px 12px;background:var(--surface);display:grid;gap:2px}
.stats span{font:600 10px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}

.lg{border-top:var(--bw) solid var(--line)}.lg:first-child{border-top:0}
.lgh{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px var(--s4);background:none;border:0;color:inherit;text-align:left;font:inherit;cursor:pointer;min-height:var(--t-min)}
.lgh .nr{font:700 18px var(--font-mono);color:var(--accent)}
.lg.open .lgh{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.lgb{padding:0 var(--s4) var(--s4)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:var(--s2) 0}
